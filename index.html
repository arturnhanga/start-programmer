<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start Programmer — Aprende. Pratica. Programa.</title>
    <meta
      name="description"
      content="Aplicativo educativo de programação do zero: Lógica de Programação, VisualG, Exercícios Interativos e Áreas da Programação."
    />
    <meta property="og:title" content="Start Programmer — Aprende. Pratica. Programa." />
    <meta
      property="og:description"
      content="Constrói bases sólidas em programação desde o zero com lógica, VisualG e prática interativa."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="apple-touch-icon" href="./logo.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Barra de Navegação Principal (Contrato de 3 Zonas) -->
    <header class="topbar" id="topbar">
      <div class="container topbar-inner">
        <!-- Zona 1: Marca -->
        <a href="#home" class="brand" data-nav="home" aria-label="Start Programmer - Página Inicial">
          <span class="brand-name">Start Programmer</span>
        </a>

        <!-- Zona 2: Links de Navegação -->
        <nav class="main-nav" id="main-nav" aria-label="Navegação principal">
          <a href="#home" class="nav-link active" data-nav="home">Início</a>
          <a href="#learn" class="nav-link" data-nav="learn">Aprender</a>
          <a href="#practice" class="nav-link" data-nav="practice">Praticar</a>
          <a href="#premium" class="nav-link" data-nav="premium">Premium</a>
          <a href="#dashboard" class="nav-link" data-nav="dashboard">Painel</a>
        </nav>

        <!-- Zona 3: Ação Principal e Menu Mobile -->
        <div class="topbar-actions">
          <button type="button" class="btn btn-primary btn-sm" id="header-cta-btn">
            Começar
          </button>
          <button
            type="button"
            class="mobile-menu-btn"
            id="mobile-menu-btn"
            aria-label="Abrir menu"
            aria-expanded="false"
            aria-controls="mobile-drawer"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Menu Mobile Deslizante -->
      <div class="mobile-drawer" id="mobile-drawer" hidden>
        <nav class="mobile-nav-list" aria-label="Navegação móvel">
          <a href="#home" class="mobile-nav-link" data-nav="home">Início</a>
          <a href="#learn" class="mobile-nav-link" data-nav="learn">Aprender</a>
          <a href="#practice" class="mobile-nav-link" data-nav="practice">Praticar</a>
          <a href="#premium" class="mobile-nav-link" data-nav="premium">Premium e Chaves</a>
          <a href="#dashboard" class="mobile-nav-link" data-nav="dashboard">Painel do Aluno</a>
          <a href="#profile" class="mobile-nav-link" data-nav="profile">Perfil</a>
          <a href="#help" class="mobile-nav-link" data-nav="help">Ajuda e Sobre</a>
        </nav>
      </div>
    </header>

    <!-- Área Principal da Aplicação -->
    <main id="app-main" class="app-main" tabindex="-1">
      <!-- O conteúdo é renderizado dinamicamente pelo script.js -->
    </main>

    <!-- Rodapé Limpo -->
    <footer class="site-footer" id="site-footer">
      <div class="container footer-inner">
        <div class="footer-brand">
          <strong>Start Programmer</strong>
          <span class="footer-sep" aria-hidden="true">·</span>
          <span>Aprende. Pratica. Programa.</span>
        </div>
        <div class="footer-links">
          <a href="#profile" data-nav="profile">Perfil</a>
          <a href="#help" data-nav="help">Ajuda</a>
          <a href="#about" data-nav="about">Sobre</a>
          <a href="#admin" data-nav="admin" aria-label="Administração">Ad</a>
        </div>
      </div>
    </footer>

    <!-- Modal Reutilizável (Sem window.alert / window.confirm) -->
    <div class="modal-backdrop" id="app-modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="modal-title" class="modal-title">Aviso</h3>
          <button type="button" class="icon-btn" id="modal-close-btn" aria-label="Fechar janela">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </div>
    </div>

    <!-- Notificações Toast -->
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
